# SLF4J Simple test configuration.
#
# Two ResourceLockContractTest tests intentionally make unlock(...) throw
# (RuntimeException or IllegalMonitorStateException) to verify that the
# library surfaces the failures via addSuppressed and via the
# IllegalMonitorStateException propagation contract. In each case the
# library legitimately logs the failure at ERROR — under normal use, this
# log is exactly what an operator wants to see in production.
#
# For the test environment, those ERROR logs are EXPECTED behaviour by
# construction (they're how the test exercises the contract), and dumping
# the stack traces into the surefire report just adds noise to a passing
# suite. Silence those two specific loggers here.
#
# The defaultLogLevel is left at info so any legitimate ERROR log from any
# OTHER class in tests still surfaces — i.e. this is a targeted silence,
# not a global gag.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.com.jsunsoft.util.concurrent.locks.AbstractResourceLock=off
org.slf4j.simpleLogger.log.com.jsunsoft.util.concurrent.locks.AbstractStripedLock=off
